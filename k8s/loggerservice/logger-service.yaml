apiVersion: v1
kind: Service
metadata:
  name: logger-service
spec:
  type: ClusterIP
  selector:
    app: logger-service
  ports:
    - name: http
      port: 6030
      targetPort: 6030
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logger-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logger-service
  template:
    metadata:
      labels:
        app: logger-service
    spec:
      serviceAccountName: logger-service
      initContainers:
        - name: wait-for-opensearch
          image: opensearchproject/opensearch:2.19.6@sha256:8690b204fe914c60ca76d451ac73bc0481e034d32d3779944c8caca56a2b003f
          command:
            - sh
            - -c
            - until curl --fail --insecure -u admin:"$OPENSEARCH_PASSWORD" https://opensearch:9200/_cluster/health; do sleep 5; done
          envFrom:
            - secretRef:
                name: loggerservice-env
      containers:
        - name: logger-service
          image: __SERVICE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6030
          envFrom:
            - secretRef:
                name: loggerservice-env
          env:
            - name: KUBERNETES_LOG_TAILING_ENABLED
              value: "true"
            - name: KUBERNETES_NAMESPACE
              value: "__KUBERNETES_NAMESPACE__"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/logger/health
              port: 6030
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/logger/health
              port: 6030
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
