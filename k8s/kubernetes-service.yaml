apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-service
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "pods", "secrets", "services"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-service
subjects:
  - kind: ServiceAccount
    name: kubernetes-service
roleRef:
  kind: Role
  name: kubernetes-service
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logger-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: logger-service
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: logger-service
subjects:
  - kind: ServiceAccount
    name: logger-service
roleRef:
  kind: Role
  name: logger-service
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: k8-service
spec:
  type: ClusterIP
  selector:
    app: kubernetes-service
  ports:
    - name: http
      port: 6011
      targetPort: 6011
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-service
  template:
    metadata:
      labels:
        app: kubernetes-service
    spec:
      serviceAccountName: kubernetes-service
      securityContext:
        fsGroup: 1000
      containers:
        - name: kubernetes-service
          image: __KUBERNETES_SERVICE_IMAGE__
          ports:
            - containerPort: 6011
          envFrom:
            - secretRef:
                name: kubernetes-service-env
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/kubernetes/health
              port: 6011
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/kubernetes/health
              port: 6011
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
