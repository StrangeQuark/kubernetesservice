apiVersion: v1
kind: Service
metadata:
  name: vault-service
spec:
  type: ClusterIP
  selector:
    app: vault-service
  ports:
    - name: http
      port: 6020
      targetPort: 6020
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-service
  template:
    metadata:
      labels:
        app: vault-service
        com.msinit.log: "true"
        com.msinit.service-name: vaultservice
    spec:
      containers:
        - name: vault-service
          image: __SERVICE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6020
          envFrom:
            - secretRef:
                name: vaultservice-env
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/vault/health
              port: 6020
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/vault/health
              port: 6020
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
