apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  type: ClusterIP
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          command:
            - /bin/sh
            - -c
            - |
              printf '{"identities":[{"name":"fileservice","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$FILE_STORAGE_ACCESS_KEY" "$FILE_STORAGE_SECRET_KEY" > /tmp/s3.json
              exec weed server -s3 -s3.port=8333 -s3.config=/tmp/s3.json -dir=/data
          ports:
            - containerPort: 8333
          envFrom:
            - secretRef:
                name: fileservice-env
          volumeMounts:
            - name: seaweedfs-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: seaweedfs-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
